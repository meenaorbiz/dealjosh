version: "2"
sql:
  - schema: "packages/backend/internal/db/schema" # Changed from a file to the folder
    queries: "packages/backend/internal/db/queries"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "packages/backend/internal/db/generated"
        emit_json_tags: true
        emit_interface: true