version: "2"
sql:
  - schema: "packages/backend/internal/db/schema/01_init.sql"
    queries: "packages/backend/internal/db/queries" # We'll create this folder next!
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "packages/backend/internal/db/generated"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true