name: Test Branch CI
on:
  push:
    branches: [ "test" ] # This triggers ONLY on your new test branch

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build Backend
        run: |
          cd packages/backend
          go build ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd packages/frontend
          npm install
          npm run build